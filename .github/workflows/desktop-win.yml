name: Build DSH Desktop (Windows, unsigned)

# 从上游源码构建 DeepSeek Harness 桌面端（Electron）的 Windows x64 **未签名**安装包。
#
# 为什么只做 Windows 未签名：
#   - 上游只给 win-x64 提供了 --unsigned 通道（package-target.ts:  "--unsigned requires win-x64"）
#   - macOS 打包**强制**要求 Apple 签名身份 + Team ID + 公证凭据，没有开发者账号根本打不出来
#     （electron-builder.config.mjs 对 macOS 必定调用 resolveMacOSNotarizationEnvironment）
#   - Windows 正式签名需要 GlobalSign EV 证书 + SafeNet USB Token + PIN，
#     只能在连接物理 Token 的自托管 runner 上做，托管 runner 无解
#
# 触发：手动 / 每天定时检查上游新版本 / 本 workflow 变更时
# 产物：GitHub Release（tag: desktop-v<版本>）+ Actions Artifacts
#
# 架构保证（64 位）：见 .github/scripts/verify-win-artifacts.mjs —— 主程序与随包分发的
# node.exe 必须通过 PE 头 AMD64 校验；该脚本自身有 .test.mjs 回归测试，构建前先自测。
#
# 约定：所有 action 使用原生基于 Node 24 的大版本（已逐个核对 runs.using）：
#   actions/checkout@v7  actions/setup-node@v7  actions/upload-artifact@v7
#   pnpm/action-setup@v6

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/desktop-win.yml"
      - ".github/scripts/**"
  schedule:
    - cron: "30 2 * * *" # UTC 02:30 = 北京时间 10:30（比 Docker 那条晚半小时）
  workflow_dispatch:
    inputs:
      ref:
        description: "上游 ref（分支/标签/commit），留空 = master"
        required: false
        default: ""
      force:
        description: "强制重建（忽略“该版本已存在”检查）"
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM_REPO: https://github.com/deepseek-ai/deepseek-harness.git
  NODE_VERSION: "24"
  PNPM_VERSION: "11.7.0"
  # Electron 应用 ID，必须是反向域名形式。
  # 想改的话在仓库 Settings → Variables 里加一个 DSH_DESKTOP_APP_ID。
  APP_ID: ${{ vars.DSH_DESKTOP_APP_ID || 'com.medyma.dsh' }}
  # mandatory-update origin：上游自 c05771d8「build(desktop): isolate test downloads by
  # release ID」起把示例文件里的这两个值**清空**（改为打包者自填）。而
  # desktop-policy-environment.mjs 的 resolveDesktopPolicyEnvironment() 是在
  # package-target.ts 的 `--unsigned` 短路**之前**执行的 —— 所以未签名构建同样要求
  # 「被选中的那个 origin」非空且是干净 HTTPS origin。默认值取上游清空前
  # （desktop-v0.1.6-alpha.2 / ddefc45）的示例值；要换域名时在仓库 Settings → Variables
  # 里覆盖同名变量，不必改本文件。两个都填，避免将来切换 AUTO_UPDATE_ENV 时踩空。
  UPDATE_TEST_ORIGIN: ${{ vars.DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN || 'https://harness-test.deepseek.com' }}
  UPDATE_PROD_ORIGIN: ${{ vars.DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN || 'https://harness.deepseek.com' }}

jobs:
  # ---------------------------------------------------------------------------
  # 架构校验器自测：不依赖上游、不依赖产物，约 2 秒。
  # 单独成一个 job 是有意的 —— 该版本 Release 已存在时 build-win 会被整段跳过，而那正是
  # 定时任务的常见路径；若把自测放在 build-win 里，闸门本身在最常见的路径下反而没人验证。
  # ---------------------------------------------------------------------------
  guard-selftest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Self-test the artifact verifier
        run: node .github/scripts/verify-win-artifacts.test.mjs

  # ---------------------------------------------------------------------------
  # 解析上游版本，判断是否需要构建
  # ---------------------------------------------------------------------------
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ref: ${{ steps.r.outputs.ref }}
      sha: ${{ steps.r.outputs.sha }}
      version: ${{ steps.r.outputs.version }}
      tag: ${{ steps.r.outputs.tag }}
      should_build: ${{ steps.r.outputs.should_build }}
    steps:
      - name: Resolve upstream ref
        id: r
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_INPUT: ${{ github.event.inputs.ref }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          REF="${REF_INPUT:-master}"
          echo "::notice::upstream ref = ${REF}"

          rm -rf upstream && mkdir upstream && cd upstream
          git init -q .
          git remote add origin "${UPSTREAM_REPO}"
          git fetch -q --depth 1 origin "${REF}"
          git checkout -q FETCH_HEAD

          SHA="$(git rev-parse HEAD)"
          VERSION="$(node -p "require('./package.json').version")"
          TAG="desktop-v${VERSION}"
          echo "::notice::upstream ${SHA} (version ${VERSION})"

          SHOULD="true"
          if [ "${FORCE:-false}" != "true" ]; then
            if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              echo "::notice::release ${TAG} 已存在，跳过构建"
              SHOULD="false"
            fi
          fi

          {
            echo "ref=${REF}"
            echo "sha=${SHA}"
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "should_build=${SHOULD}"
          } >> "$GITHUB_OUTPUT"
          echo "should_build = ${SHOULD}"

  # ---------------------------------------------------------------------------
  # Windows x64 未签名打包
  # ---------------------------------------------------------------------------
  build-win:
    needs: [resolve, guard-selftest]
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Toolchain check
        shell: bash
        run: |
          node --version
          pnpm --version
          python --version || python3 --version
          echo "APP_ID=${APP_ID}"

      - name: Clone upstream at the resolved commit
        shell: bash
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
          REF: ${{ needs.resolve.outputs.ref }}
        run: |
          set -euo pipefail
          rm -rf upstream
          git init -q upstream
          cd upstream
          git remote add origin "${UPSTREAM_REPO}"
          # 优先按 commit 拉（最可复现）；失败再按 ref 拉
          if ! git fetch -q --depth 1 origin "${SHA}"; then
            echo "按 commit 拉取失败，回退到 ref=${REF}"
            git fetch -q --depth 1 origin "${REF}"
          fi
          git checkout -q FETCH_HEAD
          echo "HEAD     = $(git rev-parse HEAD)"
          echo "expected = ${SHA}"

      # 注：此处曾有一个 “Work around the stale fs-ext assertion” 步骤，用于注释掉上游
      # apps/desktop/tests/fixtures/runtime-payload-smoke.mjs 里陈旧的 checkFsExt() 断言
      # （该断言会以 Error: Cannot find module 'fs-ext' 阻断 Windows 打包）。
      # 上游已在 6b05ed53「test(desktop): remove obsolete fs-ext payload smoke」中自
      # 行移除该断言（+2/−19 行；该文件现已是 0 处 fs-ext/checkFsExt，改用 koffi），
      # 本 workaround 因此不再需要，已删除。若将来上游又出现同类阻塞，再按需重新评估。

      - name: Install dependencies
        working-directory: upstream
        run: pnpm install --frozen-lockfile

      # 上游自 bebf88de「Use Electron Node runtime and replace Windows installations by
      # directory」起，发布/签名配置**只认** apps/desktop/.env.windows，并且会把同名的
      # 环境变量从传入环境里剥离（desktop-package-environment.mjs 的 AMBIENT_RELEASE_SETTING
      # 正则），因此原先用 `env: DSH_DESKTOP_APP_ID` 传参的做法已失效，会直接报
      #   Error: desktop package: cannot read .../apps/desktop/.env.windows
      #   ... copy .../.env.windows.example and fill in the local settings
      # 未签名构建仍会校验：APP_ID（反向域名正则）+ AUTO_UPDATE_ENV + **被选中的那个**
      # mandatory-update origin（干净 HTTPS origin）—— 因为 desktop-package-environment.mjs
      # 的 validateDesktopPackageEnvironment 在 `--unsigned` 短路之前就调用了
      # resolveDesktopPolicyEnvironment（package-target.ts 的 configuration 阶段）。
      # 只 cp 模板 + 覆盖 APP_ID 会失败在打包中途：
      #   Error: desktop package: DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN requires an HTTPS origin
      # （2026-09-23 那次 build-win 失败即此因：上游 09-20 才把模板里的值清空，而模板注释
      #  仍写着 “The selected mandatory-update origin is required, including unsigned and
      #  preparation builds”。）
      # 故此处以官方模板为底，覆盖 APP_ID 与两个 origin，并**显式断言必需键非空**——
      # 让配置缺失在本步骤就带着键名失败，而不是等打包 exit 1 后无从定位。
      # 注意：中转变量刻意**不带** DSH_ 前缀（UPDATE_TEST_ORIGIN，而非
      # DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN）—— 带前缀的名字会被上面那条
      # AMBIENT_RELEASE_SETTING 正则从传入环境里剥掉，值根本传不进来；只有写进
      # .env.windows 文件的值才作数。
      - name: Provide the Windows packaging environment
        shell: bash
        working-directory: upstream/apps/desktop
        env:
          APP_ID: ${{ env.APP_ID }}
          UPDATE_TEST_ORIGIN: ${{ env.UPDATE_TEST_ORIGIN }}
          UPDATE_PROD_ORIGIN: ${{ env.UPDATE_PROD_ORIGIN }}
        run: |
          set -euo pipefail
          cp .env.windows.example .env.windows

          # 覆盖单个 dotenv 键；模板将来若删掉该键则追加，保证值一定落地。
          set_setting() {
            local key="$1"
            local value="$2"
            if grep -q "^${key}=" .env.windows; then
              sed -i "s|^${key}=.*|${key}=${value}|" .env.windows
            else
              printf '%s=%s\n' "${key}" "${value}" >> .env.windows
            fi
          }

          set_setting DSH_DESKTOP_APP_ID "${APP_ID}"
          set_setting DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN "${UPDATE_TEST_ORIGIN}"
          set_setting DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN "${UPDATE_PROD_ORIGIN}"

          # 必需键断言：上游 resolve* 系列对这几个键要求「非空」，空值会让打包失败。
          for key in DSH_DESKTOP_APP_ID \
                     DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN \
                     DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN; do
            value="$(sed -n "s|^${key}=||p" .env.windows | head -n1)"
            if [ -z "${value}" ]; then
              echo "::error::.env.windows: ${key} 为空；上游 desktop-policy-environment 要求非空"
              exit 1
            fi
          done

          # 只回显非敏感键，确认关键项就位（签名与 COS 密钥保持模板中的空值/注释）
          grep -E '^(DSH_DESKTOP_APP_ID|DSH_DESKTOP_AUTO_UPDATE_ENV|DSH_DESKTOP_MANDATORY_UPDATE_(TEST|PROD)_ORIGIN|DSH_DESKTOP_MANDATORY_UPDATE_CONFIG)=' .env.windows || true

      - name: Package Windows x64 (unsigned)
        working-directory: upstream
        run: pnpm run package:desktop:win:x64:unsigned

      # 架构闸门 + 产物清单。上游本来就没有 32 位通道（desktop-build-paths.mjs 的
      # SUPPORTED_TARGETS 只有 mac-arm64 / mac-x64 / win-x64；package-target.ts 里 win-x64
      # 硬编码 arch:'x64'），这里再补一层二进制级校验：主程序与随包分发的 node.exe 的
      # PE Machine 必须是 AMD64(0x8664)。校验同时写出 artifacts.txt，供发布步骤只取顶层文件。
      - name: Verify artifacts are Windows x64
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/verify-win-artifacts.mjs \
            "upstream/apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts" \
            artifacts.txt

      # 只上传顶层文件：electron-builder 会在同一输出目录留下 win-unpacked/ 未打包目录
      # （约 220 MB），既不该塞进 artifact，更不能交给 gh release upload —— 对目录
      # 上传会失败（read .../win-unpacked: Incorrect function，并导致 gh 回滚整个 release）。
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dsh-desktop-win-x64-unsigned-${{ needs.resolve.outputs.version }}
          path: |
            upstream/apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.exe
            upstream/apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.blockmap
            upstream/apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.yml
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          SHA: ${{ needs.resolve.outputs.sha }}
          APP_ID: ${{ env.APP_ID }}
        run: |
          set -euo pipefail
          # artifacts.txt 由 verify 步骤写出，只含顶层可发布文件（已排除 win-unpacked/ 与
          # builder-debug.yml）。绝不能再对目录做 glob —— 那正是上一次失败的根因。
          FILES=()
          while IFS= read -r line; do
            if [ -n "$line" ]; then FILES+=("$line"); fi
          done < artifacts.txt
          if [ ${#FILES[@]} -eq 0 ]; then echo "::error::没有可发布的产物"; exit 1; fi
          echo "将发布 ${#FILES[@]} 个文件："
          printf '  %s\n' "${FILES[@]}"
          for f in "${FILES[@]}"; do
            if [ ! -f "$f" ]; then echo "::error::清单中的路径不是文件：$f"; exit 1; fi
          done

          PRERELEASE=""
          case "${VERSION}" in *-*) PRERELEASE="--prerelease" ;; esac

          NOTES="DeepSeek Harness 桌面端 **Windows x64** 安装包"
          NOTES="${NOTES}"$'\n\n'"- 上游版本: \`${VERSION}\`"
          NOTES="${NOTES}"$'\n'"- 上游提交: \`${SHA}\`"
          NOTES="${NOTES}"$'\n'"- 应用 ID: \`${APP_ID}\`"
          NOTES="${NOTES}"$'\n'"- **64 位（x64）**：主程序与随包分发的 node.exe 均经 PE 头校验为 AMD64；不含 32 位应用"
          NOTES="${NOTES}"$'\n'"  （安装包外壳是 NSIS 的 32 位引导程序，属 NSIS 自身限制，与安装后的应用位数无关）"
          NOTES="${NOTES}"$'\n'"- **未签名**：Windows SmartScreen 会提示未知发布者，安装时选「更多信息 → 仍要运行」"
          NOTES="${NOTES}"$'\n'"- 发布/更新策略取上游 .env.windows.example 模板默认值（AUTO_UPDATE_ENV=test），仅供本地安装测试"
          NOTES="${NOTES}"$'\n\n'"由 DshDocker 的 desktop-win workflow 自动构建。"

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "release ${TAG} 已存在，追加/覆盖产物"
            gh release upload "${TAG}" "${FILES[@]}" --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${TAG}" "${FILES[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "DSH Desktop ${VERSION} (Windows x64, unsigned)" \
              --notes "${NOTES}" ${PRERELEASE}
          fi
          echo "::notice::已发布 ${TAG}"
