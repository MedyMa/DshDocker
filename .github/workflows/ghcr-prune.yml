name: Prune GHCR untagged versions

# 清理 ghcr.io/<owner>/<repo> 里**无 tag** 的包版本。
#
# ── 为什么会有垃圾版本 ────────────────────────────────────────────────
# 每次构建会推送多个 manifest：2 个平台镜像、2 个 provenance attestation（buildx 默认产出，
# 内含时间戳/run id，每次内容都不同）、各架构的单架构 index，最后 merge 出带 tag 的多架构
# index。GHCR 的 versions 页面把**每个 manifest** 都计为一个版本，所以列表里绝大多数是 untagged。
#
# ── 为什么「只保留最近 N 个」是错的（踩过的坑）────────────────────────
# 最初的实现是「无 tag 里保留 created_at 最新的 N 个」。这会把镜像**删坏**：
# 平台镜像 manifest 是可复现构建的产物，digest 跨构建稳定，因此它的 created_at 是很早的，
# 按时间倒序必然落在删除区；可带 tag 的多架构 index 仍然引用它。实测删完后
# ghcr.io/.../dshdocker:latest 里 linux/amd64 指向的 manifest 变成 MANIFEST_UNKNOWN，
# amd64 用户直接拉不动（arm64 侥幸存活）。
#
# ── 现在的正确逻辑 ──────────────────────────────────────────────────
# 先算出「保护集」，再删：
#   1. 所有带 tag 的版本（tag 指向的 digest 本身）
#   2. 上述版本若为 index，则它引用的每个 digest（平台镜像 + attestation）
#   3. 保留区（最近 KEEP 个 untagged）及其 index 引用
# 只有当 digest 既无 tag、又不在保护集里，才允许删除。
# 若保护集无法确定（拿不到 token / curl 失败），**直接失败退出，一个都不删**。
#
# 为什么不用 actions/delete-package-versions：其最新版 v5.0.0（2024-01）声明
# runs.using: node20，会重新引入 Node 20 弃用警告。这里纯用 curl + jq + gh CLI，与 Node 无关。

on:
  schedule:
    - cron: "0 3 * * 0" # 每周日 UTC 03:00 = 北京时间 11:00
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只列出将要删除的版本，不实际删除"
        type: boolean
        required: false
        default: true
      keep:
        description: "保留最近多少个无 tag 版本（保护集之外另计）"
        required: false
        default: "10"

permissions:
  contents: read
  packages: write # 删除包版本需要

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Prune untagged package versions
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE: ${{ github.event.repository.name }}
          # 定时任务没有 inputs → 默认真删；手动触发默认 dry-run，先看清楚再删。
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}
          KEEP: ${{ github.event.inputs.keep || '10' }}
        run: |
          set -euo pipefail

          API_PATH="/users/${OWNER}/packages/container/${PACKAGE}/versions"
          REG="$(printf '%s' "${OWNER}" | tr '[:upper:]' '[:lower:]')/$(printf '%s' "${PACKAGE}" | tr '[:upper:]' '[:lower:]')"
          echo "包        : ${OWNER}/${PACKAGE}  (registry: ${REG})"
          echo "保留(无tag): 最近 ${KEEP} 个（保护集之外另计）"
          echo "模式      : $( [ "${DRY_RUN}" = "true" ] && echo 'DRY-RUN（不删）' || echo '实际删除' )"
          echo

          # ---- 1. 拉取所有版本 ----
          ROWS="$(gh api --paginate -H 'Accept: application/vnd.github+json' \
            "${API_PATH}?per_page=100" \
            --jq '.[] | [(.id|tostring), .created_at, ((.metadata.container.tags // [])|join("|")), .name] | @tsv')" || {
              echo "::error::读取包版本失败。请确认本 workflow 有 packages: write 权限，"
              echo "::error::且该包已关联到本仓库（Package settings → Manage Actions access）。"
              exit 1
            }
          if [ -z "${ROWS}" ]; then echo "::notice::该包没有任何版本"; exit 0; fi

          TOTAL=$(printf '%s\n' "${ROWS}" | wc -l)
          TAGGED_ROWS="$(printf '%s\n' "${ROWS}" | awk -F'\t' '$3 != ""')"
          TAGGED=$(printf '%s\n' "${TAGGED_ROWS}" | grep -c . || true)
          echo "版本总数: ${TOTAL}（带 tag ${TAGGED}，无 tag $((TOTAL - TAGGED))）"
          echo

          UNTAGGED_SORTED="$(printf '%s\n' "${ROWS}" | awk -F'\t' '$3 == ""' | sort -t$'\t' -k2,2r)"
          KEEP_LIST="$(printf '%s\n' "${UNTAGGED_SORTED}" | head -n "${KEEP}" || true)"
          CANDIDATES="$(printf '%s\n' "${UNTAGGED_SORTED}" | tail -n "+$((KEEP + 1))" || true)"

          # ---- 2. 计算保护集：带 tag 的版本 + 保留区，及其 index 引用的 digest ----
          TOKEN="$(curl -fsS -u "x-access-token:${GH_TOKEN}" \
            "https://ghcr.io/token?scope=repository:${REG}:pull&service=ghcr.io" 2>/dev/null \
            | jq -r '.token // empty' || true)"
          if [ -z "${TOKEN}" ]; then
            # 公开包可以匿名拿 token 兜底
            TOKEN="$(curl -fsS "https://ghcr.io/token?scope=repository:${REG}:pull&service=ghcr.io" 2>/dev/null \
              | jq -r '.token // empty' || true)"
          fi
          if [ -z "${TOKEN}" ]; then
            echo "::error::拿不到 registry pull token，无法确定保护集 —— 为安全起见不删除任何版本。"
            exit 1
          fi

          PROTECTED="$(mktemp)"
          refs_of() {
            curl -fsS -H "Authorization: Bearer ${TOKEN}" \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
              "https://ghcr.io/v2/${REG}/manifests/$1" 2>/dev/null \
              | jq -r '.manifests[]?.digest // empty' 2>/dev/null || true
          }
          while IFS=$'\t' read -r _id _created _tags digest; do
            [ -n "${digest}" ] || continue
            echo "${digest}" >> "${PROTECTED}"
            refs_of "${digest}" >> "${PROTECTED}"
          done < <(printf '%s\n%s\n' "${TAGGED_ROWS}" "${KEEP_LIST}" | grep . || true)
          sort -u -o "${PROTECTED}" "${PROTECTED}"
          echo "保护集（带 tag 版本 + 保留区，及其 index 引用）: $(wc -l < "${PROTECTED}") 个 digest"
          echo
          echo "---- 保护集里被 index 引用、但自身无 tag 的 digest（这些正是上次被误删的）----"
          printf '%s\n' "${CANDIDATES}" | awk -F'\t' '{print $4}' | grep -Fxf "${PROTECTED}" | sed 's/^/  /' || echo "  （无）"
          echo

          # ---- 3. 待删 = 候选 - 保护集 ----
          if [ -n "${CANDIDATES}" ]; then
            DEL_LIST="$(printf '%s\n' "${CANDIDATES}" | awk -F'\t' '{print $4}' | grep -Fxvf "${PROTECTED}" || true)"
          else
            DEL_LIST=""
          fi
          # 回填完整行（需要 id / created_at / digest）
          if [ -n "${DEL_LIST}" ]; then
            DEL_ROWS="$(printf '%s\n' "${CANDIDATES}" | awk -F'\t' 'NR==FNR{p[$1];next} ($4 in p)' \
              <(printf '%s\n' "${DEL_LIST}") -)"
          else
            DEL_ROWS=""
          fi

          echo "---- 保留（最近 ${KEEP} 个无 tag）----"
          if [ -z "${KEEP_LIST}" ]; then echo "  （无）"; else
            printf '%s\n' "${KEEP_LIST}" | awk -F'\t' '{printf "  %s  %s  %s\n", $2, substr($4,1,19), $1}'
          fi
          echo

          if [ -z "${DEL_ROWS}" ]; then
            echo "✅ 没有需要清理的无 tag 版本"
            exit 0
          fi

          echo "---- 待删除（无 tag 且不在保护集）----"
          printf '%s\n' "${DEL_ROWS}" | awk -F'\t' '{printf "  %s  %s  %s\n", $2, substr($4,1,19), $1}'
          echo

          DELETED=0
          FAILED=0
          while IFS=$'\t' read -r id created _tags digest; do
            [ -n "${id}" ] || continue
            if grep -Fxq "${digest}" "${PROTECTED}"; then
              echo "  ::warning::跳过受保护 digest ${digest}"
              continue
            fi
            if [ "${DRY_RUN}" = "true" ]; then
              echo "  [dry-run] 会删除 id=${id} (${created}) ${digest:0:19}"
              continue
            fi
            if gh api -X DELETE "${API_PATH}/${id}" >/dev/null 2>&1; then
              DELETED=$((DELETED + 1))
              echo "  已删除 id=${id} (${created}) ${digest:0:19}"
            else
              FAILED=$((FAILED + 1))
              echo "  ::warning::删除失败 id=${id} (${created})"
            fi
          done <<< "${DEL_ROWS}"

          echo
          if [ "${DRY_RUN}" = "true" ]; then
            echo "::notice::DRY-RUN 结束：本可以删除 $(printf '%s\n' "${DEL_ROWS}" | wc -l) 个无 tag 版本"
          else
            echo "::notice::已删除 ${DELETED} 个无 tag 版本，失败 ${FAILED} 个"
            if [ "${FAILED}" -gt 0 ]; then
              echo "::error::有 ${FAILED} 个版本删除失败 —— 通常是权限不足（需要 packages: write，"
              echo "::error::且该包已关联到本仓库）。报绿但没删掉会造成误导，所以这里显式失败。"
              exit 1
            fi
          fi
