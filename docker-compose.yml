services:
  dsh:
    image: ghcr.io/medyma/dshdocker:latest
    # 想本地构建就取消注释下面两行
    # build:
    #   context: .
    #   args:
    #     DSH_VERSION: latest
    container_name: dsh
    restart: unless-stopped
    ports:
      - "3080:3080"
    environment:
      DSH_HOST: "0.0.0.0"
      DSH_PORT: "3080"
      # 非 localhost 访问必须填这里，否则 /api 的浏览器信任围栏会拒绝请求
      DSH_TRUSTED_HOSTS: "192.168.1.10:3080,dsh.local:3080"
      DSH_TELEMETRY_DISABLED: "1"
      TZ: "Asia/Shanghai"
    volumes:
      # DSH_HOME：凭证 / 设置 / 会话 / profile（务必持久化）
      - ./data/dsh:/home/node/.dsh
      # 工作区：dsh 的文件读写与命令执行根目录
      - ./workspace:/workspace
