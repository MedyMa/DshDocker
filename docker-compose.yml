services:
  dsh:
    image: ghcr.io/medyma/dshdocker:latest
    # 想本地构建就取消注释下面两行
    # build:
    #   context: .
    #   args:
    #     DSH_VERSION: latest
    container_name: dsh
    restart: unless-stopped
    ports:
      - "3080:3080"
    environment:
      DSH_PORT: "3080"
      # 内部 loopback 端口（转发器指向它），一般不用改
      DSH_WEB_INTERNAL_PORT: "30801"
      # 【必填】你不是用 localhost 访问，就必须在这里声明你访问用的 authority。
      # DSH 只允许绑 loopback，且 IP 字面量不会自动信任，所以必须显式声明。
      # 不带端口 = 匹配该主机名的任意端口（推荐）；可逗号并列多个。
      DSH_TRUSTED_HOSTS: "192.168.2.1,dsh.example.com"
      DSH_TELEMETRY_DISABLED: "1"
      TZ: "Asia/Shanghai"
    volumes:
      # DSH_HOME：凭证 / 设置 / 会话 / profile（务必持久化）
      - ./data/dsh:/home/node/.dsh
      # 工作区：dsh 的文件读写与命令执行根目录
      - ./workspace:/workspace
